name: Asado Zona Norte - precios

on:
  schedule:
    - cron: '17 10 * * *' # todos los días 7:17 hora Argentina
  workflow_dispatch:
  push:
    paths:
      - 'asado-zona-norte/site/**'
      - '!asado-zona-norte/site/data/precios.json'
      - '!asado-zona-norte/site/data/historial.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: asado-zona-norte
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrapear precios
        if: github.event_name != 'push'
        run: node asado-zona-norte/scraper/scrape.mjs

      - name: Guardar datos en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add asado-zona-norte/site/data
          git diff --cached --quiet || git commit -m "Asado Zona Norte: precios $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: asado-zona-norte/site
      - id: deploy
        uses: actions/deploy-pages@v4
